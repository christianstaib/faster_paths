[package]
name = "ch"
version = "0.1.0"
edition = "2024"

[dependencies]
approx = { version = "0.6.0-rc2", features = ["ordered_float"] }
graph_readers = { git = "https://github.com/christianstaib/graph_readers.git" }
indicatif = { version = "0.18.4", features = ["rayon"] }
num-traits = "0.2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon = "1.10"
ordered-float = { version = "5", features = ["serde"] }
rand = "0.10.1"
rustc-hash = "2.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package]
name = "ch"
version = "0.1.0"
edition = "2024"

[dependencies]
num-traits = "0.2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon = "1.10"
ordered-float = { version = "5", features = ["serde"] }
rand = "0.10.1"
rustc-hash = "2.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package]
name = "ch"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
indicatif = { version = "0.18.4", features = ["rayon"] }
num-traits = "0.2"
rayon = "1.10"
ordered-float = "4"
rand = "0.10.1"
rustc-hash = "2.1.2"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
